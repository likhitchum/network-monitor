name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests with coverage gate
        run: python -m pytest --tb=short --cov=app --cov-report=term-missing --cov-report=xml:coverage.xml --cov-fail-under=75

      - name: Upload coverage XML
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: backend/coverage.xml
          if-no-files-found: ignore

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v7
        with:
          files: backend/coverage.xml
          # Required for private repos; public repos can omit it.
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  docker-build:
    runs-on: ubuntu-latest
    needs: pytest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build frontend image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          tags: wwnm-frontend:ci
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build backend image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          file: ./backend/Dockerfile
          tags: wwnm-backend:ci
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  smoke-test:
    runs-on: ubuntu-latest
    needs: pytest
    env:
      APP_SECRET: ci-secret-0123456789abcdef0123456789abcdef
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: ci-admin-pass-1234
      USER_EMAIL: user@example.com
      USER_PASSWORD: ci-user-pass-1234
    steps:
      - uses: actions/checkout@v7

      - name: Start full stack (nginx + FastAPI + SQLite)
        run: docker compose up -d --build --wait

      - name: Wait for API health via nginx proxy
        run: |
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:8080/api/health | grep -q '"status":"ok"'; then
              echo "API healthy through nginx proxy (attempt $attempt)"
              curl -fsS http://localhost:8080/api/health
              exit 0
            fi
            sleep 2
          done
          echo "::error::API did not become healthy through the nginx proxy"
          docker compose logs --tail=100
          exit 1

      - name: Frontend is served
        run: |
          curl -fsS http://localhost:8080/ | grep -q 'WinsWiew'
          echo "Frontend served via nginx"

      - name: Login works end to end (DB seed + JWT through proxy)
        run: |
          response=$(curl -fsS -X POST http://localhost:8080/api/auth/login \
            -H 'Content-Type: application/json' \
            -d "{\"email\":\"$ADMIN_EMAIL\",\"password\":\"$ADMIN_PASSWORD\"}")
          echo "$response" | grep -q access_token
          echo "Login OK: $(echo "$response" | head -c 120)..."

      - name: Tear down
        if: always()
        run: docker compose down -v

  e2e-test:
    runs-on: ubuntu-latest
    needs: pytest
    env:
      APP_SECRET: ci-secret-0123456789abcdef0123456789abcdef
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: ci-admin-pass-1234
      USER_EMAIL: user@example.com
      USER_PASSWORD: ci-user-pass-1234
      E2E_ADMIN_EMAIL: admin@example.com
      E2E_ADMIN_PASSWORD: ci-admin-pass-1234
      E2E_USER_EMAIL: user@example.com
      E2E_USER_PASSWORD: ci-user-pass-1234
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('e2e/package-lock.json') }}

      - name: Install dependencies and browser
        run: |
          cd e2e
          npm ci
          npx playwright install --with-deps chromium

      - name: Start full stack (nginx + FastAPI + SQLite)
        run: docker compose up -d --build --wait

      - name: Run Playwright E2E tests
        run: |
          cd e2e
          npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

      - name: Tear down
        if: always()
        run: docker compose down -v
