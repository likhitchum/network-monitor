[pytest]
asyncio_mode = auto
testpaths = tests
addopts = -q --cov=app --cov-report=term-missing
filterwarnings =
    # starlette.testclient warns about its own httpx/anyio usage; not actionable from our code.
    ignore:Using `httpx` with `starlette.testclient`:Warning
    ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning

[coverage:run]
source = app
omit =
    app/__init__.py

[coverage:report]
exclude_lines =
    pragma: no cover
    if TYPE_CHECKING:
